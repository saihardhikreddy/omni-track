name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tests cover the camera probe CLI, which needs only OpenCV; the YOLO/SAHI
      # app itself loads GPU models at import time and isn't imported here.
      - run: pip install opencv-python-headless pytest ruff
      - run: ruff check --select E9,F .
      - run: python -m pytest -q
